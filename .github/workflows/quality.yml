name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: |
          printf 'GEMINI_API_KEY=ci-synthetic-key\nGEMINI_MODEL=gemini-3.6-flash\n' > .env
      - run: python -m ruff check app deployment tests
      - run: python -m black --check app deployment tests
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python -m unittest tests.test_release_tooling_hardening
      - run: python -m tools.release_control validate-repository

  powershell-continuity:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - shell: powershell
        run: |
          & ".\tests\test_handover_system.ps1"
          & ".\tests\test_story_package_generator.ps1"
          $PythonPath = (Get-Command "python.exe" -ErrorAction Stop).Source
          & ".\scripts\mlai_release.ps1" -PythonPath $PythonPath validate-repository
          & ".\scripts\validate_first_service_bootstrap.ps1"
          & ".\scripts\validate_private_ingress_contract.ps1"
          & ".\scripts\validate_marketing_efficiency_governance.ps1"
