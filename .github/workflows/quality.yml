name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: |
          printf 'GEMINI_API_KEY=ci-synthetic-key\nGEMINI_MODEL=gemini-3.6-flash\n' > .env
      - run: python -m ruff check app deployment tests
      - run: python -m black --check app deployment tests
      - run: python -m unittest discover -s tests -p "test_*.py"

  powershell-continuity:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - shell: powershell
        run: |
          & ".\tests\test_handover_system.ps1"
          & ".\tests\test_story_package_generator.ps1"
          & ".\scripts\validate_private_synthetic_deployment.ps1"
          & ".\scripts\validate_release_automation.ps1"
          & ".\scripts\validate_zero_trust_supply_chain.ps1"
          & ".\scripts\validate_first_service_bootstrap.ps1"
          & ".\scripts\validate_marketing_efficiency_governance.ps1"
